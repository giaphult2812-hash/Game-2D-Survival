<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Cá Tươi 16x16 -->
  <!-- Viền tối -->
  <rect x="5" y="4" width="6" height="1" fill="#0f2942"/>
  <rect x="3" y="5" width="2" height="1" fill="#0f2942"/>
  <rect x="11" y="5" width="2" height="1" fill="#0f2942"/>
  <rect x="2" y="6" width="1" height="4" fill="#0f2942"/>
  <rect x="13" y="6" width="1" height="4" fill="#0f2942"/>
  <rect x="14" y="5" width="1" height="2" fill="#0f2942"/>
  <rect x="14" y="9" width="1" height="2" fill="#0f2942"/>
  <rect x="3" y="10" width="2" height="1" fill="#0f2942"/>
  <rect x="11" y="10" width="2" height="1" fill="#0f2942"/>
  <rect x="5" y="11" width="6" height="1" fill="#0f2942"/>

  <!-- Vây lưng & vây bụng -->
  <rect x="7" y="3" width="3" height="1" fill="#0284c7"/>
  <rect x="7" y="12" width="2" height="1" fill="#0284c7"/>

  <!-- Thân cá xanh bạc -->
  <rect x="5" y="5" width="6" height="1" fill="#38bdf8"/>
  <rect x="3" y="6" width="9" height="2" fill="#7dd3fc"/>
  <rect x="3" y="8" width="9" height="2" fill="#bae6fd"/>
  <rect x="5" y="10" width="6" height="1" fill="#94a3b8"/>

  <!-- Vảy lấp lánh & mang cá -->
  <rect x="6" y="6" width="1" height="3" fill="#0284c7"/>
  <rect x="8" y="6" width="1" height="1" fill="#e0f2fe"/>
  <rect x="10" y="7" width="1" height="1" fill="#e0f2fe"/>
  <rect x="8" y="9" width="1" height="1" fill="#ffffff"/>

  <!-- Mắt cá -->
  <rect x="4" y="7" width="1" height="1" fill="#0f172a"/>
  <rect x="4" y="6" width="1" height="1" fill="#ffffff"/>

  <!-- Đuôi cá -->
  <rect x="12" y="7" width="1" height="2" fill="#0284c7"/>
  <rect x="13" y="6" width="1" height="1" fill="#38bdf8"/>
  <rect x="13" y="9" width="1" height="1" fill="#38bdf8"/>
</svg>
