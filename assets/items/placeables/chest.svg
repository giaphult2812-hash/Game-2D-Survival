<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Đổ bóng chân rương -->
  <rect x="1" y="14" width="14" height="1" fill="rgba(0,0,0,0.35)"/>
  <!-- Khung viền gỗ sẫm bao quanh -->
  <rect x="1" y="2" width="14" height="12" fill="#3a200d"/>
  <!-- Bo góc trên nhẹ tạo dáng rương vòm -->
  <rect x="1" y="2" width="1" height="1" fill="transparent"/>
  <rect x="14" y="2" width="1" height="1" fill="transparent"/>
  <!-- Nắp rương trên (ván gỗ sáng ấm) -->
  <rect x="2" y="3" width="12" height="4" fill="#b46b2a"/>
  <rect x="3" y="3" width="10" height="1" fill="#d98d44"/>
  <rect x="2" y="4" width="12" height="1" fill="#c77d36"/>
  <!-- Khe hở giữa nắp và thân rương -->
  <rect x="2" y="7" width="12" height="1" fill="#2c1708"/>
  <!-- Thân rương dưới (ván gỗ sồi đậm vừa) -->
  <rect x="2" y="8" width="12" height="5" fill="#92521d"/>
  <rect x="2" y="9" width="12" height="1" fill="#a86227"/>
  <rect x="2" y="12" width="12" height="1" fill="#6f3b11"/>
  <!-- Đường vân gỗ dọc -->
  <rect x="5" y="4" width="1" height="3" fill="#8f4e1a"/>
  <rect x="10" y="4" width="1" height="3" fill="#8f4e1a"/>
  <rect x="5" y="8" width="1" height="4" fill="#6f3b11"/>
  <rect x="10" y="8" width="1" height="4" fill="#6f3b11"/>
  <!-- Đai sắt / đồng gia cố hai bên rương -->
  <rect x="2" y="3" width="2" height="10" fill="#475569"/>
  <rect x="12" y="3" width="2" height="10" fill="#475569"/>
  <rect x="2" y="3" width="1" height="10" fill="#64748b"/>
  <rect x="13" y="3" width="1" height="10" fill="#334155"/>
  <!-- Đinh tán trên đai sắt -->
  <rect x="3" y="4" width="1" height="1" fill="#cbd5e1"/>
  <rect x="12" y="4" width="1" height="1" fill="#cbd5e1"/>
  <rect x="3" y="11" width="1" height="1" fill="#94a3b8"/>
  <rect x="12" y="11" width="1" height="1" fill="#94a3b8"/>
  <!-- Bản lề & khóa vàng rực ở giữa -->
  <rect x="6" y="6" width="4" height="4" fill="#b45309"/>
  <rect x="7" y="6" width="2" height="3" fill="#fbbf24"/>
  <rect x="7" y="6" width="2" height="1" fill="#fef08a"/>
  <!-- Lỗ ổ khóa -->
  <rect x="7" y="8" width="2" height="1" fill="#1e293b"/>
</svg>
