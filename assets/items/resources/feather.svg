<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- Feather quill spine (dark gray/brown) -->
  <rect x="2" y="13" width="2" height="2" fill="#57534e"/>
  <rect x="4" y="11" width="2" height="2" fill="#78716c"/>
  <rect x="6" y="9" width="2" height="2" fill="#a8a29e"/>
  <rect x="8" y="7" width="2" height="2" fill="#d6d3d1"/>
  <rect x="10" y="5" width="2" height="2" fill="#e2e8f0"/>
  <rect x="12" y="3" width="2" height="2" fill="#f8fafc"/>
  
  <!-- Feather vanes (White & soft blue-gray shading) -->
  <rect x="9" y="3" width="3" height="2" fill="#f1f5f9"/>
  <rect x="7" y="5" width="3" height="2" fill="#f8fafc"/>
  <rect x="5" y="7" width="3" height="2" fill="#f1f5f9"/>
  <rect x="3" y="9" width="3" height="2" fill="#e2e8f0"/>
  <rect x="11" y="2" width="3" height="2" fill="#ffffff"/>
  <rect x="8" y="2" width="3" height="2" fill="#e2e8f0"/>
  <rect x="6" y="4" width="3" height="2" fill="#f8fafc"/>
  <rect x="4" y="6" width="3" height="2" fill="#cbd5e1"/>
  
  <!-- Bottom vane -->
  <rect x="11" y="5" width="3" height="2" fill="#e2e8f0"/>
  <rect x="9" y="7" width="3" height="2" fill="#cbd5e1"/>
  <rect x="7" y="9" width="3" height="2" fill="#94a3b8"/>
  <rect x="5" y="11" width="2" height="2" fill="#94a3b8"/>
  
  <!-- Fluffy tip / tuft (pale cyan-white highlights) -->
  <rect x="13" y="1" width="2" height="2" fill="#ffffff"/>
  <rect x="12" y="2" width="1" height="1" fill="#38bdf8"/>
  <rect x="10" y="4" width="1" height="1" fill="#e0f2fe"/>
</svg>
