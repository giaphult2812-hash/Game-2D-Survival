<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Viền tối cốt lõi #42251A -->
  <rect x="4" y="4" width="7" height="9" fill="#42251a"/>
  <rect x="5" y="3" width="6" height="10" fill="#42251a"/>
  <rect x="8" y="5" width="5" height="7" fill="#42251a"/>
  <!-- Thân nâu gỉ #6E4430 & #96644A -->
  <rect x="5" y="4" width="5" height="8" fill="#6e4430"/>
  <rect x="8" y="6" width="4" height="5" fill="#96644a"/>
  <!-- Khối màu gốm đất ấm #B88D6F -->
  <rect x="6" y="5" width="4" height="6" fill="#b88d6f"/>
  <rect x="8" y="6" width="3" height="3" fill="#b88d6f"/>
  <!-- Điểm bắt sáng kem be #E3C8A5 & #FFF8E8 -->
  <rect x="6" y="5" width="2" height="2" fill="#e3c8a5"/>
  <rect x="6" y="5" width="1" height="1" fill="#fff8e8"/>
  <rect x="9" y="6" width="1" height="1" fill="#fff8e8"/>
</svg>