<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Dáng tấm da bò trải rộng quen thuộc -->
  <rect x="4" y="3" width="8" height="10" fill="#331804"/>
  <rect x="2" y="5" width="12" height="6" fill="#331804"/>
  <rect x="3" y="11" width="10" height="2" fill="#331804"/>
  <!-- Thân da màu nâu thuộc #733E1A & #8E5225 -->
  <rect x="4" y="4" width="8" height="8" fill="#733e1a"/>
  <rect x="3" y="6" width="10" height="4" fill="#8e5225"/>
  <!-- Vùng trung tâm sáng #A06132 & #C4844D -->
  <rect x="5" y="5" width="6" height="6" fill="#a06132"/>
  <rect x="6" y="6" width="3" height="3" fill="#c4844d"/>
